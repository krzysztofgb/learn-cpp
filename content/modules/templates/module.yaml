title: Templates
topics: Deduction, specialization, NTTPs, variadics, folds, CTAD, two-phase lookup
intro: "Templates are how C++ gets zero-cost abstraction: the compiler generates a separate copy of the code for each set of template arguments (monomorphization), so every call is direct and can be fully inlined. The price is compile time and code size, and the rules for deduction, specialization and name lookup are the source of most template interview questions."
