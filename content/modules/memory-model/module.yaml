title: Memory model
topics: Happens-before, data races, every memory order, fences, litmus tests, ARM vs x86
intro: "This is the topic low-latency C++ interviews probe hardest. Know the definitions precisely, be able to reason about litmus tests, and know how memory orders map to x86 and ARM instructions. An ARM machine (Apple Silicon, AWS Graviton, Ampere, Windows on ARM, …) is a gift here: ARM reorders more aggressively than x86, so ordering bugs that hide on x86 show up there. On x86 you can still observe store buffering, and Compiler Explorer shows the ARM code for both."
