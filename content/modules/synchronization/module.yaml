title: Synchronization
topics: "`jthread`, locks, deadlock, condition variables, `latch`/`barrier`/`semaphore`, atomic wait"
intro: Go gives you goroutines and channels and a race detector. C++ gives you OS threads, mutexes, condition variables and atomics, and data races are UB. This module covers the blocking primitives; Modules :mod[memory-model]{bare} and :mod[lock-free-programming]{bare} cover atomics and lock-free code.
