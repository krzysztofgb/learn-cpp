title: Synchronization
topics: "`jthread`, locks, deadlock, condition variables, `latch`/`barrier`/`semaphore`, atomic wait"
intro: C++ concurrency starts from OS threads, mutexes, condition variables and atomics, and a data race is undefined behavior, not just a wrong value. This module covers the blocking primitives; Modules :mod[memory-model]{bare} and :mod[lock-free-programming]{bare} cover atomics and lock-free code.
