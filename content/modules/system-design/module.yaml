title: System design
topics: Market data handler, order gateway, risk checks, off-hot-path logging
intro: "Trading system design rounds differ from web-scale ones: the priorities are microseconds, determinism, correctness under failure, and recovery, not horizontal scaling. Experience with distributed systems carries over to the replay, recovery and audit parts; the new part is single-box, nanosecond-budget thinking."
