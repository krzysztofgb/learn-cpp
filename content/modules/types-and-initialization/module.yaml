title: Types and initialization
topics: Integer promotion, usual arithmetic conversions, signed overflow UB, every initialization form, narrowing, most vexing parse, `const` vs `constexpr`
intro: "Most C++ bugs that pass code review come from the rules in this module: implicit conversions, overflow, and initialization. Interviewers use them for warm-up questions because a wrong answer quickly reveals a mental model carried over from a language with stricter conversions and defined overflow."
