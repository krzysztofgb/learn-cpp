<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="C++ for quant dev interviews, with a C++23 compiler running in your browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>learn-cpp</title>
    <script>
      // Apply a saved light/dark choice before first paint (see ThemeToggle).
      try {
        const theme = localStorage.getItem('learn-cpp/theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
