<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="C++ for low-latency systems, with a C++23 compiler running in your browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>learn-cpp</title>
    <script>
      // Set the theme before first paint (see ThemeToggle): the saved choice, or the system's.
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem('learn-cpp/theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
